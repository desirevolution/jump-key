name: Publish Docker image

on:
  release:
    types: [published]

concurrency:
  group: publish-dropnote-image
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Read release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ $version_pattern || ${#version} -gt 128 ]]; then
            echo '::error::Use a release tag such as v0.1.0 or v0.2.0-rc.1.'
            exit 1
          fi
          {
            printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the release image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: DROPNOTE_RELEASE_TAG=v${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=Dropnote
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update latest for the current stable release
        if: ${{ !github.event.release.prerelease && !contains(steps.release.outputs.version, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$latest_release" != "$RELEASE_TAG" ]]; then
            printf 'Leaving latest unchanged. Current GitHub release is %s.\n' "$latest_release"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${IMAGE_DIGEST}"
