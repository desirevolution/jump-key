<!doctype html>
<html lang="de" data-theme="midnight" class="bg-slate-900 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JumpKey dashboard</title>
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark light" />

    <meta name="google-site-verification" content="CqS-O5AIFrdwkzxGUyhTprOXb75_WiAv_o79_OpQnac" />
    <meta name="title" content="JumpKey dashboard demo" />
    <meta name="description" content="A minimalist, keyboard-driven local first PWA startpage for your services." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://desirevolution.github.io/jump-key/" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css" />

    <script>
      try {
        const supportedThemes = [
          'midnight',
          'ocean',
          'graphite',
          'emerald',
          'tokyo-night',
          'catppuccin-mocha',
          'gruvbox-dark',
          'daylight',
          'nord-light',
          'solarized-light',
        ];
        const lightThemes = new Set(['daylight', 'nord-light', 'solarized-light']);
        const storedTheme = localStorage.getItem('jump-key-theme');
        const theme = supportedThemes.includes(storedTheme) ? storedTheme : 'midnight';

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.colorScheme = lightThemes.has(theme) ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'midnight';
        document.documentElement.dataset.colorScheme = 'dark';
      }
    </script>
    <link rel="icon" type="image/x-icon" href="/jump-key.ico" />
  </head>
  <body class="p-4 sm:p-8 lg:w-4/5 mx-auto min-h-screen flex flex-col justify-between select-none">
    <a class="github-fork-ribbon" href="https://github.com/desirevolution/jump-key" data-ribbon="JumpKey on Github" title="Fork me on GitHub">Fork me on GitHub</a>
    <dashboard-app></dashboard-app>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
